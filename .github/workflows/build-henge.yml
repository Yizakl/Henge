# .github/workflows/probe-sdk.yml
#
# 只做诊断，不编译 Henge，约 40 秒跑完。
# 目的：确认 iPhoneOS SDK 的 Foundation 头目录是否完整，
# 以及一个最小的 ObjC 文件能否在该 SDK 下编译通过。

name: Probe iOS SDK

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Inventory and smoke test
        run: |
          set -x
          ls -d /Applications/Xcode*.app || true
          for x in /Applications/Xcode*.app; do
            echo "== $x"
            "$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -2 || true
            ls -d "$x/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/"*.sdk 2>/dev/null || true
          done
          echo "== active"; xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"; echo "SDK=$SDK"
          H="$SDK/System/Library/Frameworks/Foundation.framework/Headers"
          echo "headers in Foundation: $(ls "$H" 2>/dev/null | wc -l)"
          for f in NSURL.h NSGeometry.h NSURLHandle.h NSKeyedArchiver.h NSObject.h NSObjCRuntime.h NSValue.h; do
            if [ -f "$H/$f" ]; then echo "present $f"; else echo "MISSING $f"; fi
          done
          echo "== first 40 headers"; ls "$H" 2>/dev/null | head -40
          echo "== header maps?"; ls "$SDK/usr/lib" 2>/dev/null | head -5
          echo "== smoke test: minimal ObjC file including Foundation, for iOS arm64"
          printf '#import <Foundation/Foundation.h>\nint main(void){ return 0; }\n' > /tmp/t.m
          if xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -c /tmp/t.m -o /tmp/t.o; then
            echo "SMOKE OK"
          else
            echo "SMOKE FAILED"
          fi
          echo "== same file, with modules forced off"
          if xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fno-modules -c /tmp/t.m -o /tmp/t2.o; then
            echo "SMOKE2 OK"
          else
            echo "SMOKE2 FAILED"
          fi
