# .github/workflows/build-henge.yml  —— v4
#
# 与 v3 相同：照常构建 + 打包。
# 新增：最后一步把诊断结论写成 GitHub 注解（::warning title=...::），
# 注解在公开的 job 页面上可见，无需登录即可读取，也写进 $GITHUB_STEP_SUMMARY。
#
# 注解包括：
#   Env         —— SDKROOT / CPATH / CPLUS_INCLUDE_PATH / OBJC_INCLUDE_PATH / DEVELOPER_DIR
#   Settings    —— SDKROOT / ARCHS / PLATFORM_NAME / EFFECTIVE_PLATFORM_NAME / ONLY_ACTIVE_ARCH / OTHER_CFLAGS
#   Standalone  —— 脱离 xcodebuild 直接 clang 编 henge-tl-app.m 的结果
#   Headers     —— iOS SDK 里 NSURLHandle.h / NSGeometry.h 是否缺失（预期都 MISSING）
#   Triples     —— buildlog 里出现过的所有 -target 值
#   Sysroots    —— buildlog 里出现过的所有 -isysroot 值
#   FailingTU   —— 报错前最后一个 CompileC 的 .m 文件
#   FirstError  —— 第一行 error

name: Build Henge IPA

on:
  workflow_dispatch: {}

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out Henge (this fork)
        uses: actions/checkout@v4
        with:
          path: Henge

      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          path: Husk

      - name: Cache Husk's sources and prebuilt iOS pieces
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen meson ninja pkg-config
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }

      - name: Fetch Husk's third-party sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      - name: Build the iOS libraries Henge needs
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build Husk's on-device pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Copy prebuilt deps into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build the restore stack (libirecovery, usbmuxd, idevicerestore)
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Build the engine
        working-directory: Henge
        run: make ios-lib

      - name: Diagnose (SDK, build settings, stray env, standalone compile)
        working-directory: Henge
        run: |
          set +e
          F=/tmp/facts.txt
          : > "$F"

          echo "--- env ---"
          ENVLINE="$(env | grep -i -E '^(SDKROOT|CPATH|C_INCLUDE_PATH|CPLUS_INCLUDE_PATH|OBJC_INCLUDE_PATH|DEVELOPER_DIR|MACOSX_DEPLOYMENT_TARGET)=' || echo none)"
          echo "ENV: $ENVLINE" >> "$F"

          echo "--- generate ---"
          cd ios
          xcodegen generate > /tmp/xcodegen.log 2>&1
          echo "XCODEGEN_RC=$?" >> "$F"

          echo "--- build settings ---"
          xcodebuild -project Henge.xcodeproj -scheme Henge -configuration Release \
            -sdk iphoneos -showBuildSettings > /tmp/settings.txt 2>&1
          SETLINE="$(grep -E '^\s+(SDKROOT|ARCHS|PLATFORM_NAME|EFFECTIVE_PLATFORM_NAME|ONLY_ACTIVE_ARCH|OTHER_CFLAGS|SUPPORTED_PLATFORMS) =' /tmp/settings.txt | tr -s ' ' | tr '\n' ';')"
          echo "SETTINGS: $SETLINE" >> "$F"

          echo "--- standalone compile ---"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKPATH: $SDK" >> "$F"
          if xcrun --sdk iphoneos clang -x objective-c \
               -target arm64-apple-ios17.0 -isysroot "$SDK" -fobjc-arc -fmodules \
               -I../core -I../host -I../devices -IHenge/Native \
               -fsyntax-only Henge/Native/henge-tl-app.m > /tmp/standalone.log 2>&1; then
            echo "STANDALONE=OK" >> "$F"
          else
            echo "STANDALONE=FAILED" >> "$F"
            echo "STANDALONE_ERR: $(grep -m2 'error:' /tmp/standalone.log | tr '\n' '|' | cut -c1-300)" >> "$F"
          fi

          echo "--- headers ---"
          H="$SDK/System/Library/Frameworks/Foundation.framework/Headers"
          for f in NSURLHandle.h NSGeometry.h NSURL.h; do
            if [ -f "$H/$f" ]; then echo "HEADER_$f=present" >> "$F"; else echo "HEADER_$f=MISSING" >> "$F"; fi
          done
          cat "$F"

      - name: Package Henge.ipa
        working-directory: Henge
        id: package
        run: |
          set +e
          zsh ios/scripts/package_ipa.sh
          RC=$?
          echo "package_rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      # 无论成败都执行：把结论写成注解，公开页面可见
      - name: Report as annotations
        if: always()
        working-directory: Henge
        run: |
          set +e
          F=/tmp/facts.txt
          LOG=ios/build/DerivedData.buildlog

          emit() {
            T="$1"; shift
            M="$(printf '%s' "$*" | tr '\n\r' '  ' | cut -c1-900)"
            echo "::warning title=${T}::${M}"
          }

          emit Env "$(grep '^ENV:' "$F" 2>/dev/null | cut -c6-)"
          emit Settings "$(grep '^SETTINGS:' "$F" 2>/dev/null | cut -c11-)"
          emit Standalone "$(grep -E '^STANDALONE' "$F" 2>/dev/null | tr '\n' ' ')"
          emit Headers "$(grep -E '^HEADER_' "$F" 2>/dev/null | tr '\n' ' ')"

          if [ -f "$LOG" ]; then
            emit Triples "$(grep -a -o -- '-target [^ ]*' "$LOG" | sort -u | tr '\n' ' ')"
            emit Sysroots "$(grep -a -o -- '-isysroot [^ ]*' "$LOG" | sort -u | tr '\n' ' ')"
            emit FailingTU "$(awk '/^CompileC /{tu=$2} /error:/{print tu; exit}' "$LOG" | tr '\n' ' ')"
            emit FirstError "$(grep -a -m1 'error:' "$LOG" | cut -c1-400)"
          else
            emit BuildLog "no buildlog at $LOG"
          fi

          {
            echo "### Henge 构建诊断"
            echo ""
            echo '```'
            cat "$F" 2>/dev/null
            if [ -f "$LOG" ]; then
              echo ""
              echo "triples: $(grep -a -o -- '-target [^ ]*' "$LOG" | sort -u | tr '\n' ' ')"
              echo "sysroots: $(grep -a -o -- '-isysroot [^ ]*' "$LOG" | sort -u | tr '\n' ' ')"
              echo "failing TU: $(awk '/^CompileC /{tu=$2} /error:/{print tu; exit}' "$LOG")"
              echo "first error: $(grep -a -m1 'error:' "$LOG")"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
