# .github/workflows/build-henge.yml  —— v5（修 SDKROOT 泄漏，预期能出货）
#
# 根因：ios/project.yml 的 preBuildScript 里 `make ios-lib build/henge-agent.gz
# build/tl-samples.dmg` 会把 Xcode 导出的 SDKROOT=iphoneos27.x 传进 tl/Makefile；
# tl/Makefile 用 `CC = xcrun clang`（没 --sdk macosx）+ `-target arm64-apple-macos13`
# 编 Mac 侧程序 → macOS 三要素 + iOS SDK 头 → 要 NSURLHandle.h / NSGeometry.h。
#
# 修法：在 preBuildScript 里清掉 SDKROOT 等平台变量（make ios-lib 与 henge-agent
# 都自己显式带 --sdk，不依赖这些），本 workflow 在构建前自动打这行补丁。

name: Build Henge IPA

on:
  workflow_dispatch: {}

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out Henge (this fork)
        uses: actions/checkout@v4
        with:
          path: Henge

      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          path: Husk

      - name: Cache Husk's sources and prebuilt iOS pieces
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen meson ninja pkg-config
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }

      # 补丁：让 preBuildScript 里的 make 不继承 Xcode 的 iOS SDKROOT
      - name: Patch the preBuildScript (stop leaking SDKROOT into the Mac build)
        working-directory: Henge
        run: |
          set -eux
          sed -i '' 's|^          make ios-lib build/henge-agent.gz build/tl-samples.dmg$|          env -u SDKROOT -u IPHONEOS_DEPLOYMENT_TARGET -u PLATFORM_NAME -u EFFECTIVE_PLATFORM_NAME make ios-lib build/henge-agent.gz build/tl-samples.dmg|' ios/project.yml
          test "$(grep -c 'env -u SDKROOT' ios/project.yml)" = "1"
          grep -n 'env -u SDKROOT' ios/project.yml

      - name: Fetch Husk's third-party sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      - name: Build the iOS libraries Henge needs
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build Husk's on-device pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Copy prebuilt deps into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build the restore stack (libirecovery, usbmuxd, idevicerestore)
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Build the engine
        working-directory: Henge
        run: make ios-lib

      - name: Package Henge.ipa
        working-directory: Henge
        id: package
        run: |
          set +e
          zsh ios/scripts/package_ipa.sh
          RC=$?
          echo "package_rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Upload Henge.ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Henge-ipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.ipa
          if-no-files-found: error

      - name: Package Henge.tipa
        if: success()
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh --trollstore

      - name: Upload Henge.tipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Henge-tipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.tipa
          if-no-files-found: error

      # 失败时把结论写成公开注解，可直接读
      - name: Report as annotations
        if: failure()
        working-directory: Henge
        run: |
          set +e
          LOG=ios/build/DerivedData.buildlog
          emit() {
            T="$1"; shift
            M="$(printf '%s' "$*" | tr '\n\r' '  ' | cut -c1-900)"
            echo "::warning title=${T}::${M}"
          }
          emit PatchApplied "$(grep -c 'env -u SDKROOT' ios/project.yml) line(s)"
          if [ -f "$LOG" ]; then
            emit Triples "$(grep -a -o -- '-target [^ ]*' "$LOG" | sort -u | tr '\n' ' ')"
            emit Sysroots "$(grep -a -o -- '-isysroot [^ ]*' "$LOG" | sort -u | tr '\n' ' ')"
            emit FirstError "$(grep -a -m1 'error:' "$LOG" | cut -c1-400)"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -a -m5 'error:' "$LOG" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            emit BuildLog "no buildlog"
          fi
