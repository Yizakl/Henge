# .github/workflows/build-henge.yml
#
# Builds an unsigned Henge.ipa from your fork's main on a GitHub-hosted macOS
# runner, no Mac needed. Public repos get free minutes, macOS included.
#
# Changes from upstream's file (Leviidev/Henge):
#   * prefers Xcode 27.0 when the image still has it: iPhoneOS 27.1's SDK ships a
#     Foundation/NSURL.h that pulls in the macOS-only Foundation/NSURLHandle.h and
#     breaks every Objective-C file that includes Foundation.
#   * falls back to stubbing that one header inside the SDK (build machine only,
#     never part of the app) when 27.0 is gone.
#   * scrubs CPATH / C_INCLUDE_PATH / CPLUS_INCLUDE_PATH / OBJC_INCLUDE_PATH /
#     SDKROOT before xcodebuild: a stray macOS include path makes the iOS SDK pick
#     macOS conditionals, which is the other way this same error shows up.

name: Build Henge IPA

on:
  workflow_dispatch: {}

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out Henge (this fork)
        uses: actions/checkout@v4
        with:
          path: Henge

      - name: Check out Husk
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          path: Husk

      - name: Cache Husk's sources and prebuilt iOS pieces
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen meson ninja pkg-config
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }

      - name: Pick Xcode 27.0 when the image still has it
        run: |
          set -x
          ls -d /Applications/Xcode*.app || true
          for app in /Applications/Xcode_27.0*.app /Applications/Xcode_27.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              echo "SELECTED=$app" >> "$GITHUB_ENV"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          env | grep -iE '^(CPATH|C_INCLUDE_PATH|CPLUS_INCLUDE_PATH|OBJC_INCLUDE_PATH|SDKROOT)=' || echo "no include-path env set"

      - name: Fetch Husk's third-party sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      - name: Build the iOS libraries Henge needs
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build Husk's on-device pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Copy prebuilt deps into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build the restore stack (libirecovery, usbmuxd, idevicerestore)
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Build the engine
        working-directory: Henge
        run: make ios-lib

      - name: Package Henge.ipa (with SDK-header fallback)
        working-directory: Henge
        run: |
          set -u
          pkg() {
            env -u CPATH -u C_INCLUDE_PATH -u CPLUS_INCLUDE_PATH \
                -u OBJC_INCLUDE_PATH -u SDKROOT \
                zsh ios/scripts/package_ipa.sh
          }

          if pkg; then exit 0; fi

          LOG=ios/build/DerivedData.buildlog
          if grep -q "NSURLHandle.h' file not found" "$LOG" 2>/dev/null; then
            SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
            HDR="$SDK/System/Library/Frameworks/Foundation.framework/Headers/NSURLHandle.h"
            echo "==> iPhoneOS $(xcrun --sdk iphoneos --show-sdk-version) SDK wants the macOS-only NSURLHandle.h; stubbing it at $HDR"
            sudo sh -c "printf '#import <Foundation/NSObject.h>\n' > \"$HDR\""
            rm -rf ios/build/DerivedData
            pkg
          else
            echo "==> not the NSURLHandle error; nothing stubbed, failing as upstream does"
            exit 1
          fi

      - name: Upload Henge.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-ipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.ipa
          if-no-files-found: error

      - name: Package Henge.tipa
        working-directory: Henge
        run: env -u CPATH -u C_INCLUDE_PATH -u CPLUS_INCLUDE_PATH -u OBJC_INCLUDE_PATH -u SDKROOT zsh ios/scripts/package_ipa.sh --trollstore

      - name: Upload Henge.tipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-tipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.tipa
          if-no-files-found: error
